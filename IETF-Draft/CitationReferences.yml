extends: script
message: "%s"
link: https://www.rfc-editor.org/rfc/rfc7322.html#section-4.8
level: error
scope: raw
script: |
  text := import("text")
  matches := []
  references := {}
  ignored := []
  fenced := text.re_find("(?ms)^```[^\\n]*\\n.*?^```[ \\t]*$", scope, -1)
  if fenced != undefined {
    for block in fenced {
      ignored = append(ignored, block[0])
    }
  }
  inline := text.re_find("`[^`\\n]+`", scope, -1)
  if inline != undefined {
    for block in inline {
      ignored = append(ignored, block[0])
    }
  }
  definitions := text.re_find("(?m)^(\\[[A-Z][A-Z0-9.-]{2,}\\])", scope, -1)
  if definitions != undefined {
    for definition in definitions {
      m := definition[0]
      skip := false
      for block in ignored {
        blockEnd := block.begin + len(block.text)
        if m.begin >= block.begin && m.begin < blockEnd {
          skip = true
          break
        }
      }
      if !skip {
        references[m.text] = true
      }
    }
  }
  citations := text.re_find("(\\[[A-Z][A-Z0-9.-]{2,}\\])", scope, -1)
  if citations != undefined {
    for citation in citations {
      m := citation[0]
      skip := false
      for block in ignored {
        blockEnd := block.begin + len(block.text)
        if m.begin >= block.begin && m.begin < blockEnd {
          skip = true
          break
        }
      }
      if skip {
        continue
      }
      next := m.begin + len(m.text)
      if next < len(scope) && scope[next:next+1] == "(" {
        continue
      }
      if references[m.text] == undefined {
        matches = append(matches, {
          begin: m.begin,
          end: m.begin + len(m.text),
          message: "Add a matching reference definition for this citation."
        })
      }
    }
  }
