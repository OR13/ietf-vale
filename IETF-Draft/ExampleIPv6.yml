extends: script
message: "%s"
link: https://www.rfc-editor.org/rfc/rfc3849.html
level: warning
scope: raw
script: |
  text := import("text")
  matches := []
  found := text.re_find("(?i)(?:[0-9a-f]{1,4}:){2,7}[0-9a-f:]{0,4}", scope, -1)
  for f in found {
    m := f[0]
    start := m.begin - 20
    if start < 0 {
      start = 0
    }
    finish := m.begin + len(m.text) + 20
    if finish > len(scope) {
      finish = len(scope)
    }
    context := scope[start:finish]
    example := text.re_find("(?i)(example|e\\.g\\.|for example|documentation|sample)", context, -1)
    if example == undefined || len(example) == 0 {
      continue
    }
    allowed := text.re_find("(?i)^(?:2001:db8:|3fff:)", m.text, -1)
    if allowed == undefined || len(allowed) == 0 {
      matches = append(matches, {
        begin: m.begin,
        end: m.begin + len(m.text),
        message: "Use an RFC 3849 or RFC 9637 documentation prefix for this example IPv6 address."
      })
    }
  }
