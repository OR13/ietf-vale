extends: script
message: "%s"
link: https://www.rfc-editor.org/rfc/rfc7322.html#section-3.3
level: warning
scope: raw
script: |
  text := import("text")
  matches := []
  found := text.re_find("(?i)\\b(?:foo|mydomain|test|company)\\.(?:com|net|org)\\b", scope, -1)
  for f in found {
    m := f[0]
    start := m.begin - 20
    if start < 0 {
      start = 0
    }
    finish := m.begin + len(m.text) + 20
    if finish > len(scope) {
      finish = len(scope)
    }
    context := scope[start:finish]
    example := text.re_find("(?i)(example|e\\.g\\.|for example|documentation|sample)", context, -1)
    if example != undefined && len(example) > 0 {
      matches = append(matches, {
        begin: m.begin,
        end: m.begin + len(m.text),
        message: "Use a reserved example domain such as example.com, example.net, or example.org."
      })
    }
  }
