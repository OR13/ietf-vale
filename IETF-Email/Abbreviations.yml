extends: script
message: "%s"
link: https://www.rfc-editor.org/rfc/rfc7322.html#section-3.6
level: suggestion
scope: ~code
script: |
  text := import("text")
  matches := []
  known := "\\b(?:AAAA|ABNF|ACK|ADSL|AES|AFI|AFS|AI|API|APNIC|ARIN|ARM|ARP|ASBR|ASCII|ASM|ATM|AVP|AVPF|BCH|BCP|BDS|BER|BGP|BIOS|BIRD|BNF|BOF|BSD|CDMA|CDMA2000|CDMF|CERT|CNAME|CPU|CRH|CRLF|DER|DES|DHCP|DNS|DNSSEC|DSA|DSL|DTD|DTLS|DVI|EBCDIC|ECMP|EGP|EHLO|ENUM|EOF|EOR|EPUB|ESMTP|ETSI|EVPN|FIB|FIFO|FIPS|FTP|GLOP|GMPLS|GPS|GRE|GSM|GUI|HD|HTML|HTTP|HTTPS|IAB|IANA|ICANN|ICMP|IEC|IEEE|IESG|IETF|IGMP|IGP|IMAP|IOS|IP|IPR|IPTV|IRTF|IS|ISDN|ISO|ISOC|ISP|ISSN|ITU|JPEG|JSON|L2VPN|L3VPN|LACNIC|LAN|LDP|LF|LTE|MAN|MAY|MD5|MEDIACTRL|MIB|MIME|MIPS|MPEG|MPLS|MTU|MUST|NACK|NAPT|NAPTR|NAT|NEWPRED|NFS|NIST|NP|NS|NSD|NSEC|NSF|NTP|NTSC|OCB|OID|OPTIONAL|OS|OSI|OSPF|PAC|PAL|PCE|PCM|PCMU|PDA|PDC|PDF|PDU|PEM1|PIM|PIN|PKCS|PKI|PKIX|PNG|POSIX|PPP|PSN|QNAME|QSIG|QUIC|RADIUS|RAM|RC4|RCODE|RDP|RECOMMENDED|REQUIRED|RESTCONF|RFC|RGB|RIB|RIP|RLE|ROM|RPC|RSA|RSS|RSVP|RTCP|RTCWEB|RTP|RTT|RTX|SAFI|SAVP|SAVPF|SDK|SHA|SHALL|SHOULD|SIP|SMS|SMTP|SNMP|SOA|SOAP|SOCKS|SPHINCS|SQL|SRV|SSL|SSM|SVG|SYN|TCP|TDMA|TE|TFTP|TLS|TLSA|TLV|TTL|TX|UDP|UHF|UI|URI|URL|URN|USB|UTC|VHF|VLAN|VPN|W3C|WAN|WG|WLAN|WWW|XML|XOR|YADIFA|YAML|YANG|ZRTP)\\b"
  urls := text.re_find("https?://[^\\s<>]+", scope, -1)
  candidates := text.re_find("\\b[A-Z][A-Z0-9]{1,}\\b", scope, -1)
  if candidates != undefined {
    for candidate in candidates {
      m := candidate[0]
      ignored := false
      if urls != undefined {
        for url in urls {
          u := url[0]
          if m.begin >= u.begin && m.begin < u.begin + len(u.text) {
            ignored = true
            break
          }
        }
      }
      if !ignored && text.re_find(known, m.text, -1) != undefined {
        ignored = true
      }
      if !ignored {
        expansion := text.re_find("(?i)\\b[A-Za-z][A-Za-z -]+[ ]+\\(" + m.text + "\\)", scope, -1)
        if expansion != undefined && len(expansion) > 0 {
          continue
        }
        matches = append(matches, {
          begin: m.begin,
          end: m.begin + len(m.text),
          message: "Expand '" + m.text + "' on first use, unless it is a well-known abbreviation."
        })
      }
    }
  }

