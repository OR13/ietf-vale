extends: existence
message: "This dismisses a position without data; BCP 54 asks for facts so others can form an opinion."
link: https://www.rfc-editor.org/rfc/rfc7154.html#section-2
level: suggestion
ignorecase: true
scope: ~code & ~blockquote
# RFC 7154 (BCP 54), Section 2: "Try to provide data and facts for your
# standpoints so the rest of the participants who are sitting on the sidelines
# watching the discussion can form an opinion."
tokens:
  - 'everyone knows'
  - 'this is nonsense'
  - "(that's|that is) (absurd|ridiculous|nonsense)"
  - 'makes no sense at all'
  - 'obviously wrong'
  - 'no one (actually )?(uses|wants|needs)'
