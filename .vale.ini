StylesPath = .

MinAlertLevel = suggestion

# This repository's own prose is draft-style prose, so it is linted with the
# style it ships. The email style is exercised by its fixtures, not here.
[*.md]
BasedOnStyles = IETF-Draft

# The specifications quote the patterns these rules match -- a citation tag with
# a space, a hyphenated citation, an HTTP URI -- as examples of what to avoid.
# All three read `scope: raw`, because Markdown hides their targets from the
# prose scope, and raw sees inside code spans too. There is no way to mark an
# example as an example, so they are disabled for the specifications only.
[docs/*.md]
BasedOnStyles = IETF-Draft
IETF-Draft.CitationSpacing = NO
IETF-Draft.RFCCompoundHyphen = NO
IETF-Draft.HttpsUris = NO
IETF-Draft.Abbreviations = NO
IETF-Draft.DraftTitleStatusWords = NO
IETF-Draft.StaleText = NO
IETF-Draft.DoubleNegatives = NO
IETF-Draft.Bcp14Boilerplate = NO
IETF-Draft.CitationReferences = NO

# README.md contains an intentionally insecure URI so the usage example can
# demonstrate the alert. The example is not a document being checked.
[README.md]
BasedOnStyles = IETF-Draft
IETF-Draft.HttpsUris = NO
IETF-Draft.Abbreviations = NO
IETF-Draft.DraftTitleStatusWords = NO
IETF-Draft.StaleText = NO
IETF-Draft.DoubleNegatives = NO
IETF-Draft.Bcp14Boilerplate = NO
IETF-Draft.CitationReferences = NO

[CONTRIBUTING.md]
BasedOnStyles = IETF-Draft
IETF-Draft.Abbreviations = NO
IETF-Draft.DraftTitleStatusWords = NO
IETF-Draft.StaleText = NO
IETF-Draft.DoubleNegatives = NO
IETF-Draft.Bcp14Boilerplate = NO
IETF-Draft.CitationReferences = NO
