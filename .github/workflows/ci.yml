name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pinned so a Vale release can never silently change what our recorded
  # expectations mean. Bump it in its own PR, with the resulting testdata diff.
  VALE_VERSION: "3.21.0"
  GO_VERSION: "1.21"

jobs:
  lint:
    name: Lint YAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install yamllint

      - run: yamllint -c .yamllint.yml IETF-Draft/ IETF-Email/ coverage/

  test:
    name: Rules + fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install Vale
        run: |
          wget -q "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          mkdir -p bin && tar -xzf "vale_${VALE_VERSION}_Linux_64-bit.tar.gz" -C bin
          echo "$PWD/bin" >> "$GITHUB_PATH"

      - name: Vale version
        run: vale --version

      - name: Test
        run: go test ./...

      - name: Coverage report
        run: |
          {
            echo '## Style guide coverage'
            echo '```'
            go test -v -run TestCoverage ./... 2>&1 | sed -n '/style guide coverage/,/^--- \|^ok \|^PASS/p'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  integration:
    name: Vale runs clean
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Vale
        run: |
          wget -q "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          mkdir -p bin && tar -xzf "vale_${VALE_VERSION}_Linux_64-bit.tar.gz" -C bin
          echo "$PWD/bin" >> "$GITHUB_PATH"

      # Catches malformed rules that the fixtures don't reach: Vale refuses to
      # build a config it can't parse.
      - name: Load the style
        run: vale ls-config > /dev/null

      # The style has to be clean against our own prose, or we're shipping
      # guidance we don't follow.
      - name: Lint this repository
        run: vale README.md CONTRIBUTING.md docs/

  sources:
    name: Cited RFCs are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # A rule that cites a superseded document loses its argument on contact
      # with a reviewer, so this is checked rather than remembered.
      - run: python3 scripts/check-sources.py

  docs:
    name: Specifications
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      # docs/ is an OKF bundle. Errors fail the build. Exactly two warnings are
      # expected and deliberate:
      #   okf-version-supported -- we target OKF v0.2; the linter implements v0.1
      #   recommended-log       -- the bundle has no log.md; git is the history
      # A third warning means something new broke.
      - name: Lint the OKF bundle
        run: npx --yes @thisismydesign/okf-lint@${OKF_LINT_VERSION} docs --max-warnings 2
        env:
          OKF_LINT_VERSION: "0.1.0"

  package:
    name: Package
    runs-on: ubuntu-latest
    strategy:
      matrix:
        style: [IETF-Draft, IETF-Email]
    steps:
      - uses: actions/checkout@v7

      # The archive is what users install, so the license travels inside it.
      - run: cp LICENSE ${{ matrix.style }}/LICENSE
      - run: zip -r ${{ matrix.style }}.zip ${{ matrix.style }} -x "*.DS_Store"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.style }}.zip
          path: ${{ matrix.style }}.zip
          if-no-files-found: error
