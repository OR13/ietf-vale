name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Publish style packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The archive is what users install, so the license travels inside it.
      - run: make package-check

      # One uploader creates the release and attaches every archive. Concurrent
      # release creation can split the assets across duplicate releases.
      - name: Attach to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: "*.zip"
          file_glob: true
          tag: ${{ github.ref }}
