name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Publish IETF.zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The archive is what users install, so the license travels inside it.
      - run: cp LICENSE IETF/LICENSE
      - run: zip -r IETF.zip IETF -x "*.DS_Store"

      - name: Attach to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: IETF.zip
          tag: ${{ github.ref }}
