# RFC style conventions: https://www.rfc-editor.org/rfc/rfc7322.html
#
# RFC 7322 Section 3: language, punctuation, DNS names and URIs,
# capitalization, citations, and abbreviation rules.

# SpellingConsistency.yml
language: true

# Serial commas, quotation marks, hyphenation, spacing.
# NonAsciiPunctuation.yml
punctuation: true

# Example DNS names and URIs, per BCP 32.
# ExampleDomains.yml
dns-names-and-uris: true

# StaleText.yml
stale-text: true

# Capitalization of terms, headings, and protocol names.
# DidacticCapitalization.yml
capitalization: true

# In-text citation form, and citations in the Abstract.
# CitationSpacing.yml, RFCCompoundHyphen.yml, AngleBracketsURI.yml
citations: true

# Expansion on first use, and the RFC Editor abbreviations list.
# AbbreviationVerbs.yml and Abbreviations.yml
abbreviations: true
