# Conduct guidance for IETF discussion: https://www.rfc-editor.org/info/bcp54
#                                        https://www.rfc-editor.org/info/bcp45
#                                        https://www.rfc-editor.org/rfc/rfc9945.html
#
# These documents govern behavior, not vocabulary, and moderation of them is
# explicitly a human judgment call (RFC 9945, Appendix B). A key set to true
# means only that a rule surfaces candidate phrasings for the author to
# reconsider -- never that the linter has judged a message.

# BCP 54, Section 2: "limiting the use of slang".
# Slang.yml
slang: true

# BCP 54, Section 2: idioms that do not survive translation.
# Idioms.yml
idioms: true
